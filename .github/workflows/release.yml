name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Every release must be signed with the same key, or a phone refuses to update in place.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set; see AGENTS.md, Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ACETAG_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          ACETAG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ACETAG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ACETAG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain testDebugUnitTest assembleRelease -PreleaseVersion="${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="acetag-$GITHUB_REF_NAME.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --generate-notes --title "AceTag $GITHUB_REF_NAME"
