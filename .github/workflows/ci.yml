name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew --console=plain testDebugUnitTest assembleDebug

      # The APK to sideload when a PR says what to try on the phone.
      - uses: actions/upload-artifact@v7
        with:
          name: acetag-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
